<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦠</text></svg>">
    
    <title>Noöscope — Lexicon</title>
  <script type="module" crossorigin src="./assets/lexicon.1b9a537a.js"></script>
  <link rel="modulepreload" href="./assets/style.7f2dd081.js">
  <link rel="stylesheet" href="./assets/style.728e411e.css">
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">
    <div class="container mx-auto px-4 py-8 sm:py-12 max-w-5xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-sky-600 tracking-tight">
                <a href="index.html" class="hover:text-sky-700 transition-colors">Noöscope</a> — Lexicon
            </h1>
            <p class="mt-2 text-slate-600">Word-level linguistic diversity per source — the output of <code class="bg-slate-200 px-1 rounded">node scripts/lexicon.mjs</code>.</p>
        </header>

        <!-- Shown until a lexicon.json is loaded -->
        <div id="empty-state" class="bg-white border border-slate-200 rounded-lg shadow-sm p-8 text-center">
            <p class="text-slate-600 mb-4">Drop in a <code class="bg-slate-200 px-1 rounded">lexicon.json</code> file, choose one, or load it via <code class="bg-slate-200 px-1 rounded">?data=&lt;url&gt;</code>.</p>
            <label for="load-file-input" class="inline-flex items-center px-4 py-2 bg-sky-600 text-white font-semibold rounded-lg shadow-sm hover:bg-sky-700 cursor-pointer transition-colors">Choose File</label>
            <input type="file" id="load-file-input" accept=".json" class="hidden" />
        </div>

        <div id="status-area" class="mt-4 text-center text-slate-500"></div>

        <div id="lexicon-content" class="hidden mt-2 space-y-8"></div>
    </div>
    
</body>
</html>
