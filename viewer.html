<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postscope - Visualization</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" type="text/css" href="./style.css">
</head>
<body class="font-sans antialiased text-slate-900 bg-slate-100">
    <div class="main-container flex h-screen w-screen overflow-hidden">
        
        <!-- Controls Panel (Left) -->
        <aside class="controls-panel w-[400px] bg-white border-r border-slate-200 flex flex-col shadow-lg z-10">
            <!-- Header -->
            <div class="p-6 shrink-0 space-y-6">
                <header class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-sky-600 tracking-tight">
                        <a href="index.html" class="hover:text-sky-700 transition-colors">Postscope</a>
                    </h1>
                </header>
                
                <div id="version-notification-area"></div>
                <div id="visualization-title-area" class="relative -mt-2"></div>
                <div id="source-info" class="text-sm text-slate-700"></div>
                
                <div class="space-y-4">
                    <div class="control-group">
                        <label for="min-cluster-size" class="block text-sm font-medium text-slate-700 mb-1">Minimum Cluster Size</label>
                        <input id="min-cluster-size" type="number" min="1" class="w-full px-3 py-2 bg-white border border-slate-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition"/>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <button id="recluster-button" class="w-full inline-flex items-center justify-center px-4 py-2 bg-sky-600 text-white font-semibold rounded-md shadow-sm hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition-colors">Update Clusters</button>
                        <button id="toggle-labels-button" class="w-full inline-flex items-center justify-center px-4 py-2 bg-white border border-slate-300 rounded-md font-semibold text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition-colors">Toggle Text</button>
                    </div>
                </div>
                 <div id="status-area"></div>
            </div>

            <!-- Cluster Manager List -->
            <div class="flex-1 overflow-y-auto px-6 border-t border-slate-200">
                <div id="cluster-manager" class="py-6">
                    <label class="block text-sm font-semibold text-slate-800 mb-3">Clusters</label>
                    <div id="cluster-list-container" class="space-y-1"></div>
                </div>
            </div>

            <div id="vertical-resizer" class="h-1.5 cursor-row-resize shrink-0 bg-slate-200 hover:bg-sky-400 transition-colors"></div>

            <!-- Query Container with Locate Button -->
            <div id="query-container" class="shrink-0 p-6 flex flex-col" style="height: 10rem;">
                <label for="query-input" class="block text-sm font-medium text-slate-700 mb-1">Find Your Own Text</label>
                <div class="relative w-full flex-1 flex flex-col">
                    <textarea id="query-input" placeholder="Type or paste text to see where it lands on the map..." class="w-full h-full px-3 py-2 pr-10 bg-white border border-slate-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition placeholder:text-slate-400 resize-none rounded-lg"></textarea>
                    
                    <button id="focus-query-btn" class="absolute bottom-3 right-3 p-1.5 rounded-md text-slate-400 hover:text-sky-600 hover:bg-slate-100 transition-all opacity-0 pointer-events-none disabled:opacity-0" title="Center map on this text">
                        <span class="material-symbols-outlined text-xl">my_location</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Visualization Panel (Right) -->
        <main class="visualization-panel flex-1 flex flex-col bg-slate-100 relative">
            <div id="visualization-container" class="flex-1 relative min-h-0"></div>
            
            <!-- Timeline Controls -->
            <div id="timeline-controls" class="bg-white/95 border-t border-slate-200 px-4 py-2 shrink-0 hidden select-none">
                <div class="flex justify-between text-xs font-semibold text-slate-500 mb-1">
                    <span id="timeline-start-label">Start</span>
                    <span id="timeline-end-label">End</span>
                </div>
                <div id="timeline-brush-container" class="relative w-full h-12 cursor-crosshair">
                    <canvas id="timeline-histogram" class="absolute inset-0 h-full w-full pointer-events-none z-0 opacity-40"></canvas>
                    <div id="timeline-window" class="absolute h-full z-10 top-0 cursor-grab active:cursor-grabbing group">
                        <div class="absolute inset-0 bg-sky-500/10 border-t-2 border-b-2 border-sky-500"></div>
                        <div class="timeline-handle handle-left absolute left-0 top-0 bottom-0 w-4 -ml-2 cursor-ew-resize z-20 flex items-center justify-center group-hover:opacity-100 transition-opacity">
                            <div class="w-1.5 h-6 bg-sky-500 rounded-full shadow-sm"></div>
                        </div>
                        <div class="timeline-handle handle-right absolute right-0 top-0 bottom-0 w-4 -mr-2 cursor-ew-resize z-20 flex items-center justify-center group-hover:opacity-100 transition-opacity">
                             <div class="w-1.5 h-6 bg-sky-500 rounded-full shadow-sm"></div>
                        </div>
                    </div>
                    <div id="timeline-dimmer-left" class="absolute left-0 top-0 bottom-0 bg-slate-100/50 z-0 pointer-events-none"></div>
                    <div id="timeline-dimmer-right" class="absolute right-0 top-0 bottom-0 bg-slate-100/50 z-0 pointer-events-none"></div>
                </div>
            </div>

            <div id="response-list-container" class="hidden"></div>
        </main>

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
